[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyanimation-engine"
version = "0.1.0"
description = "A low-level Python 2D/3D animation engine with CPU and WebGPU rasterizers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10",
    "imageio-ffmpeg>=0.4.9",
    "wgpu>=0.29,<0.31; python_version < '3.11'",
    "wgpu>=0.32,<0.33; python_version >= '3.11'",
]

[project.scripts]
pyanimation = "pyanimation.cli:main"

[tool.setuptools.packages.find]
include = ["pyanimation*"]
